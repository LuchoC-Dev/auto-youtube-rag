name: Feature request
description: Propose a new capability or a change to existing behavior.
title: "feat: <short description>"
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or awkward today? Who runs into it, and when?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What you'd like to see instead. If it changes the CLI contract
        (a command, flag, exit code, or JSON receipt shape), say so
        explicitly.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you didn't pick them.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        Anything else useful — links to related issues, docs, or prior
        discussion.
    validations:
      required: false
